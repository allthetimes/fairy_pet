<script>
/* ============================================================
   自动对齐参数 (scripts/compare_align.py 实测 20260913-130732.mp4)
   cx/cy: 核心圆心 (视频像素)   R_px: 最外白描边半径 = SVG r=100
   T: 白环呼吸实测周期      P0: 相位偏移 (互相关 0.933)
   ============================================================ */
const ALIGN = { cx:470.47, cy:539.34, R:216.77, T:0.8667, P0:0.3413, corr:0.980, W:1920, H:1080 };
const svg = document.getElementById('svg');
const vid = document.getElementById('vid');

/* ---------- 靛蓝层: 环带 + 四尖齿, 单一 path (同 fairy-lab) ---------- */
const NOTCH_ANGLE = [33.5, 123.5, 213.5, 303.5];
const P = { base:78.1, tip:93.0, half:12.5 };
function buildIndigo(){
  const R = P.base, T = P.tip, H = P.half, A = NOTCH_ANGLE, n = A.length;
  const pt = (r, deg) => {
    const t = deg * Math.PI / 180;
    return `${(r * Math.cos(t)).toFixed(2)} ${(r * Math.sin(t)).toFixed(2)}`;
  };
  let d = `M ${pt(T, A[0])}`;
  for (let i = 0; i < n; i++){
    const nextAbs = (i === n - 1) ? A[0] + 360 : A[i + 1];
    d += ` L ${pt(R, A[i] + H)}`;
    d += ` A ${R} ${R} 0 0 1 ${pt(R, nextAbs - H)}`;
    d += ` L ${pt(T, nextAbs)}`;
  }
  document.getElementById('indigoShape').setAttribute('d', d + ' Z');
}

/* ---------- 逐环呼吸: 参数同 fairy-lab, 周期用实测值 ---------- */
function applyBreath(){
  const T = ALIGN.T;
  const RINGS = [
    ['whitePulseAnim', 0.041,  0.00],
    ['slatePulseAnim', 0.055, -0.031],
    ['midPulseAnim',   0.060, -0.062],
    ['pupilPulseAnim', 0.099, -0.093],
  ];
  // 高光摆动与呼吸锁相 (实测), 只同步周期不缩放
  const sway = document.getElementById('glintSwayAnim');
  if (sway) sway.setAttribute('dur', T + 's');
  for (const [id, amp, phase] of RINGS) {
    const el = document.getElementById(id);
    const a = amp;
    const lo = (1 - a).toFixed(4);
    el.setAttribute('dur', T + 's');
    el.setAttribute('begin', phase + 's');
    el.setAttribute('values', `${lo};${lo};1;${lo}`);
    el.setAttribute('keyTimes', '0;0.155;0.688;1');
    el.setAttribute('calcMode', 'spline');
    el.setAttribute('keySplines', '0 0 1 1;0.3 0 0.3 1;0.5 0 1 1');
  }
}

/* ---------- 舞台: 以核心为中心裁剪视频帧, SVG 按实测半径铺放 ---------- */
const CROP_FACTOR = 2.6;                       // 舞台边长 = 2.6 x 核心半径
let mode = 'side';
const cropVideo = document.getElementById('cropVideo');
const cropSvg   = document.getElementById('cropSvg');
const cropOver  = document.getElementById('cropOver');

function sizeStage(crop, big){
  const side = big ? Math.min(innerHeight * 0.78, innerWidth * 0.62, 780)
                   : Math.min(innerHeight * 0.62, innerWidth * 0.44, 540);
  crop.style.width = crop.style.height = side + 'px';
}
function place(crop, videoHere, svgHere){
  const side = parseFloat(crop.style.width);
  const f = side / (CROP_FACTOR * ALIGN.R);           // CSS px / 视频px
  const s = ALIGN.R / 100 * adjS();                   // SVG单位 -> 视频px (含手动缩放)
  if (videoHere){
    vid.style.width  = ALIGN.W * f + 'px';
    vid.style.height = ALIGN.H * f + 'px';
    vid.style.left = (-(ALIGN.cx - CROP_FACTOR * ALIGN.R / 2) * f) + 'px';
    vid.style.top  = (-(ALIGN.cy - CROP_FACTOR * ALIGN.R / 2) * f) + 'px';
  }
  if (svgHere){
    const w = 240 * s * f;   /* viewBox -120..120 = 240 单位 */
    svg.setAttribute('width', w); svg.setAttribute('height', w);
    svg.style.width = w + 'px'; svg.style.height = w + 'px';
    svg.style.left = (side / 2 - 120 * s * f + adjX() * f) + 'px';
    svg.style.top  = (side / 2 - 120 * s * f + adjY() * f) + 'px';
  }
}
function layout(){
  if (mode === 'side'){
    sizeStage(cropVideo, false); sizeStage(cropSvg, false);
    place(cropVideo, true, false);
    place(cropSvg, false, true);
  } else {
    sizeStage(cropOver, true);
    place(cropOver, true, true);
  }
}

/* ---------- 模式切换: 同一个 video/svg 节点在容器间搬移 ---------- */
function setMode(m){
  mode = m;
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  document.getElementById('grpAlpha').style.display = (m === 'over') ? '' : 'none';
  document.getElementById('colVideo').style.display = (m === 'side') ? '' : 'none';
  document.getElementById('colSvg').style.display   = (m === 'side') ? '' : 'none';
  document.getElementById('colOver').style.display  = (m === 'side') ? 'none' : '';
  if (m === 'side'){
    cropVideo.appendChild(vid);
    cropSvg.appendChild(svg);
    svg.style.mixBlendMode = 'normal';
    applyAlpha(1);
  } else {
    cropOver.appendChild(vid);
    cropOver.appendChild(svg);
    svg.style.mixBlendMode = (m === 'diff') ? 'difference' : 'normal';
    applyAlpha(m === 'diff' ? 1 : parseFloat(document.getElementById('alpha').value) / 100);
  }
  document.getElementById('capOver').innerHTML = m === 'diff'
    ? '<b>差值</b> — 重合处近黑，错位处发亮'
    : '<b>叠加</b> — 亮环错位即差距';
  layout();
}
function applyAlpha(a){
  svg.style.opacity = (mode === 'diff') ? 1 : a;
  if (mode === 'diff'){ svg.style.opacity = 1; }
}

/* ---------- 主时钟: 视频驱动 SMIL (setCurrentTime 逐帧跟随) ---------- */
svg.pauseAnimations();                         // 冻结 SMIL 自有时钟
let phase = ALIGN.P0;
let playing = false;
let lastT = 0, fpsAcc = 0, fpsN = 0, fpsShown = 0;

function loop(now){
  const t = vid.currentTime + phase;
  svg.setCurrentTime(t);
  document.getElementById('tVid').textContent = vid.currentTime.toFixed(3) + 's';
  document.getElementById('tSvg').textContent = t.toFixed(3) + 's';
  if (lastT){
    fpsAcc += 1 / Math.max((now - lastT) / 1000, 1e-3); fpsN++;
    if (fpsN >= 30){ fpsShown = fpsAcc / fpsN; fpsAcc = 0; fpsN = 0;
      document.getElementById('fpsRead').textContent = fpsShown.toFixed(0) + ' fps'; }
  }
  lastT = now;
  requestAnimationFrame(loop);
}

/* ---------- 控件 ---------- */
function adjX(){ return parseFloat(document.getElementById('adjX').value); }
function adjY(){ return parseFloat(document.getElementById('adjY').value); }
function adjS(){ return parseFloat(document.getElementById('adjS').value); }

function togglePlay(){
  if (vid.paused){ vid.play().catch(()=>{}); playing = true; }
  else { vid.pause(); playing = false; }
  document.getElementById('btnPlay').textContent = vid.paused ? '▶ 同步播放' : '⏸ 暂停';
}
document.getElementById('btnPlay').onclick = togglePlay;
document.getElementById('btnRestart').onclick = () => {
  vid.currentTime = 0; svg.setCurrentTime(phase);
};
document.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-rate]').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  vid.playbackRate = parseFloat(b.dataset.rate);
});
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.getElementById('alpha').oninput = e => {
  document.getElementById('alphaV').textContent = e.target.value + '%';
  applyAlpha(parseFloat(e.target.value) / 100);
};
document.getElementById('phase').oninput = e => {
  phase = parseFloat(e.target.value);
  document.getElementById('phaseV').textContent = (phase >= 0 ? '+' : '') + phase.toFixed(3) + 's';
};
['adjX','adjY','adjS'].forEach((id, i) => {
  document.getElementById(id).oninput = e => {
    const v = parseFloat(e.target.value);
    document.getElementById(['adjXV','adjYV','adjSV'][i]).textContent =
      i === 2 ? v.toFixed(3) : (v >= 0 ? '+' : '') + v.toFixed(1);
    layout();
  };
});
document.getElementById('zoom').oninput = e => {
  const z = parseFloat(e.target.value);
  document.getElementById('zoomV').textContent = z.toFixed(2) + 'x';
  const target = (mode === 'side') ? [cropVideo, cropSvg] : [cropOver];
  target.forEach(c => { c.style.transform = `scale(${z})`; c.style.transformOrigin = 'center'; });
  document.querySelector('main').style.gap = (22 * z) + 'px';
};
document.getElementById('gearPh').oninput = e => {
  const v = parseFloat(e.target.value);
  document.getElementById('gearPhV').textContent = v.toFixed(2) + 's';
  document.getElementById('gearSpinAnim').setAttribute('begin', (-v) + 's');
};
document.getElementById('gearT').oninput = e => {
  const v = parseFloat(e.target.value);
  document.getElementById('gearTV').textContent = v.toFixed(1) + 's';
  document.getElementById('gearSpinAnim').setAttribute('dur', v + 's');
};
document.getElementById('btnMute').onclick = e => {
  vid.muted = !vid.muted;
  e.target.textContent = vid.muted ? '🔇 静音' : '🔊 有声';
};
addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowLeft'  && vid.paused){ vid.currentTime = Math.max(0, vid.currentTime - (e.shiftKey ? 0.5 : 1/60)); }
  if (e.code === 'ArrowRight' && vid.paused){ vid.currentTime = Math.min(vid.duration || 12, vid.currentTime + (e.shiftKey ? 0.5 : 1/60)); }
});
addEventListener('resize', layout);

/* ---------- 启动 ---------- */
buildIndigo();
applyBreath();
document.getElementById('gearSpinAnim').setAttribute('begin', '-15.67s');   /* 实测齿轮初相 */
document.getElementById('phaseV').textContent = '+' + ALIGN.P0.toFixed(3) + 's';
setMode('side');
svg.setCurrentTime(ALIGN.P0);
requestAnimationFrame(loop);
</script>
