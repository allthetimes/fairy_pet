<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FairyPet</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
            font:13px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  /* 布局: 内容贴底居中，上方空间留给台词气泡 */
  body{
    --s:1;                                   /* 缩放系数，由 JS 写入 */
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:calc(30px * var(--s));
    -webkit-user-select:none; user-select:none;
  }

  /* 桌宠容器：透明底；尺寸由内部 SVG 决定 */
  .pet{position:relative; cursor:grab; -webkit-user-select:none; user-select:none}
  .pet:active{cursor:grabbing}
  /* SVG 允许溢出：辉光 r=135 超出 viewBox ±120，不裁切 */
  #svg{overflow:visible; display:block}

  .float{animation:float 3.4s ease-in-out infinite; will-change:transform; transition:filter .3s}
  @keyframes float{
    0%,100%{transform:translateY(-4px) scale(1)}
    50%    {transform:translateY(4px)  scale(1.012)}
  }
  .pet.talking .float{filter:brightness(1.16) saturate(1.08)}
  .pet:hover .float{filter:brightness(1.15)}
  .pet.clicked .float{animation:clickpunch .42s cubic-bezier(.34,1.56,.64,1)}
  @keyframes clickpunch{
    0%{transform:scale(1)} 35%{transform:scale(.92)} 70%{transform:scale(1.045)} 100%{transform:scale(1)}
  }
  .pet.glitch .core{animation:rgbsep .3s steps(2) infinite}
  @keyframes rgbsep{
    0%{filter:none}
    33%{filter:drop-shadow(-3px 0 0 rgba(255,60,60,.55)) drop-shadow(3px 0 0 rgba(60,255,220,.5))}
    66%{filter:drop-shadow(2px 0 0 rgba(255,60,60,.4))}
  }

  /* ---- 台词气泡（临时样式：等游戏内截图/视频后再仿照重做） ---- */
  .bubble{
    position:absolute;
    left:50%; bottom:100%;                   /* 贴在圆盘上方 */
    margin-bottom:calc(-14px * var(--s));    /* 略压住圆盘顶部 */
    transform:translateX(-50%);
    /* ⚠️ 必须显式 width:max-content：abspos + left:50% 的收缩宽度受
       "left 之后剩余空间"(=200px) 限制，单写 max-width 永远不生效（实测踩坑） */
    width:max-content;
    max-width:min(calc(440px * var(--s)), calc(100vw - 24px));   /* 320→440: 每行多装 ~40% 字（用户 09-15 反馈） */
    min-width:calc(80px * var(--s));
    padding:calc(9px * var(--s)) calc(14px * var(--s));
    background:rgba(16,20,44,.9);
    border:1px solid rgba(96,150,255,.55);
    border-radius:calc(12px * var(--s));
    color:#dbe3f5;
    font-size:max(11px, calc(13px * var(--s)));
    line-height:1.6;
    box-shadow:0 4px 24px rgba(20,40,120,.35);
    opacity:0; transition:opacity .28s;
    pointer-events:none;                     /* 不挡鼠标：气泡期间仍可拖拽/点击 */
    word-break:break-word;
  }
  .bubble.show{opacity:1}
  .bubble .caret{display:inline-block;width:2px;height:1em;margin-left:1px;
                 background:#7fa8ff;vertical-align:-2px;animation:caret .8s step-end infinite}
  @keyframes caret{50%{opacity:0}}
</style>
</head>

<script>
const NOTCH_ANGLE = [33.5, 123.5, 213.5, 303.5];   // 实测（图像坐标，0°=右，顺时针）
/* 靛蓝环带外缘 / 尖齿顶端 / 尖齿基底半角 —— 全部实测。
   形状是"线性收敛到 0"的真尖点（不是梯形）。参数由扫参拟合官方轮廓确定：
   用色系边界（靛蓝→亮蓝）逐半径量半宽，比较实测轮廓，误差从 0.97° 降到 0.14°：
     官方      u=.79→10.25  .82→7.38  .85→4.75  .88→2.50  .90→1.12  .91→0.50  尖端 0.916
     本实现    u=.79→10.38  .82→7.50  .85→4.75  .88→2.62  .90→1.12  .91→0.38  尖端 0.918
   扫参钩子：?half=..&tip=.. */
const P = { base: 78.1, tip: 93.0, half: 12.5 };

/* ============ 1. 生成靛蓝层：环带 + 四根尖齿，合成单一 path ============ */
function buildIndigo(){
  const R = P.base, T = P.tip, H = P.half, A = NOTCH_ANGLE, n = A.length;
  const pt = (r, deg) => {
    const t = deg * Math.PI / 180;
    return `${(r * Math.cos(t)).toFixed(2)} ${(r * Math.sin(t)).toFixed(2)}`;
  };
  // 从第一个尖齿的尖端出发，顺时针走：回齿基 → 沿圆弧到下一齿 → 冲到下一齿尖端
  let d = `M ${pt(T, A[0])}`;
  for (let i = 0; i < n; i++){
    const a = A[i];
    const nextAbs = (i === n - 1) ? A[0] + 360 : A[i + 1];   // 最后一齿绕回第一齿
    d += ` L ${pt(R, a + H)}`;                                // 尖端 → 本齿右侧基底
    d += ` A ${R} ${R} 0 0 1 ${pt(R, nextAbs - H)}`;          // 沿环带弧 → 下一齿左侧基底
    d += ` L ${pt(T, nextAbs)}`;                              // → 下一齿尖端
  }
  document.getElementById('indigoShape').setAttribute('d', d + ' Z');
}

const svg = document.getElementById('svg');

/* ============ 2. 参数（设置窗口实时接管） ============ */
/* CFG: 默认值（= fairy-lab 校准值）；启动时被主进程配置覆盖（Electron petAPI.getConfig） */
const CFG = {
  breath: 0.867, breathStr: 100, gear: 18.13, scan: 2.2, idleMin: 25, scale: 1,
  rOuter: 100, indOuter: 78.1, whiteOuter: 62.2, whiteInner: 41.5,
  iris: 14.9, tip: 93.0, half: 12.5, glint: 14.1,
};

/* ============ 桌宠大小（设置窗口按百分比调） ============ */
/* 基准: 窗口 500×600 / SVG 显示 400px（viewBox 240 单位 ⇒ 1u = 1.667px）
   布局: SVG 贴底居中，上方 ~150px 留给气泡；辉光 r=135u=225px 靠 #svg{overflow:visible} 不被裁 */
const BASE_W = 500, BASE_H = 600, BASE_SVG = 400;
const SCALE_MIN = 0.5, SCALE_MAX = 2.0;

function applyScale(s){
  s = Math.min(SCALE_MAX, Math.max(SCALE_MIN, Number(s) || 1));
  CFG.scale = s;
  document.body.style.setProperty('--s', String(s));
  const svgEl = document.getElementById('svg');
  svgEl.setAttribute('width',  (BASE_SVG * s).toFixed(1));
  svgEl.setAttribute('height', (BASE_SVG * s).toFixed(1));
  /* 窗口尺寸交给主进程（保持右下角锚点） */
  if (petAPI) petAPI.setSize(s);
  else console.warn('[scale] 非 Electron 环境，无窗口尺寸 API');
}

function applyBreath(){
  const T = CFG.breath;
  const strength = CFG.breathStr / 100;
  // [id, 幅度, 启动延迟 s]  由内到外排列: 索引 0 = 最小环
  const RINGS = [
    ['pupilPulseAnim', 0.099, 0.000],   // 深眼    ±9.9%, 最小 → 最先动
    ['midPulseAnim',   0.060, 0.035],   // 蓝瞳    ±6.0%, 比深眼晚 35ms
    ['slatePulseAnim', 0.055, 0.057],   // 灰紫蓝  ±5.5%, 比蓝瞳晚 22ms
    ['whitePulseAnim', 0.041, 0.096],   // 白环    ±4.1%, 比灰紫蓝晚 39ms
  ];
  // 高光摆动与呼吸锁相 (实测), 只同步周期不缩放
  const sway = document.getElementById('glintSwayAnim');
  if (sway) sway.setAttribute('dur', T + 's');
  // 闭眼帽檐与呼吸锁相: dur 一致; begin = 白环 begin(0.096) + 实测滞后 0.042
  const lid = document.getElementById('closedLidMoveAnim');
  if (lid){
    lid.setAttribute('dur', T + 's');
    lid.setAttribute('begin', (0.096 + 0.042).toFixed(3) + 's');
  }
  for (const [id, amp, delay] of RINGS) {
    const el = document.getElementById(id);
    if (!el) continue;
    const a = amp * strength;
    const lo = (1 - a).toFixed(4);
    el.setAttribute('dur', T + 's');
    // begin 只写一次: 避免重写 begin 导致 SMIL 重启动画
    if (el.dataset.delayInit !== '1'){
      el.setAttribute('begin', delay.toFixed(3) + 's');
      el.dataset.delayInit = '1';
    }
    el.setAttribute('values', `${lo};${lo};1;${lo}`);
    el.setAttribute('keyTimes', '0;0.155;0.688;1');
    el.setAttribute('calcMode', 'spline');
    el.setAttribute('keySplines', '0 0 1 1;0.3 0 0.3 1;0.5 0 1 1');
  }
}

function setRates(talking){
  const g = talking ? '1.1s' : '2.4s';
  document.querySelectorAll('#glowPulse > animateTransform, #glowPulse > animate')
    .forEach(a => a.setAttribute('dur', g));
  document.getElementById('scanAnim').setAttribute('dur', talking ? '.22s' : '.5s');
}
function applyGear(){
  document.getElementById('gearSpinAnim').setAttribute('dur', CFG.gear + 's');
}
function setLidB(on){
  // 闭眼帽檐只有一个图层: 外缘贴合齿轮基圆, 底缘按实测轨迹走。
  // (旧的 stateB_lid_bot「半径200的固定弧」已删除 —— 它最深到 y=15.9,
  //  会比实测底缘 y=2.4~11.3 多露出一圈深色。)
  document.getElementById('stateB_lid_top').style.display = on ? '' : 'none';
}
function setState(s){
  pet.classList.remove('talking','glitch','clicked');
  setLidB(s === 'closed');
  if (s === 'glitch'){
    pet.classList.add('glitch');
    setTimeout(() => { pet.classList.remove('glitch'); setState('idle'); }, 600);
    cur = 'idle';
    document.querySelectorAll('#states button').forEach(b =>
      b.classList.toggle('on', b.dataset.st === 'idle'));
    return;
  }
  if (s !== 'idle') pet.classList.add(s);
  cur = s;
  setRates(s === 'talking');
  document.querySelectorAll('#states button').forEach(b =>
    b.classList.toggle('on', b.dataset.st === s));
}



/* ============ 桌宠交互: 拖拽 / 点击 / 悬停 ============ */
let cur = 'idle';

/* --- Electron API 桥 ---
   preload 通过 contextBridge 暴露 window.petAPI；
   浏览器调试环境（无 preload）降级为空操作。
   ⚠️ 必须用 var 而不是 const/let：contextBridge 已在全局对象上定义了 petAPI 属性，
      顶层 const 会与它冲突并抛 "Identifier 'petAPI' has already been declared"，
      导致整个脚本不执行（窗口尺寸/配置全都失效）。var 与既有全局属性可以共存。 */
var petAPI = (typeof window !== 'undefined' && window.petAPI) || null;

/* listen 桥: 事件名 → preload 注册函数 */
function listen(event, handler){
  if (!petAPI) return () => {};
  const reg = {
    'settings-changed': petAPI.onSettingsChanged,
    'pet-hidden':       petAPI.onPetHidden,
    'pet-shown':        petAPI.onPetShown,
  }[event];
  return reg ? (reg(handler) || (() => {})) : (() => {});
}
const petEl = document.getElementById('pet');
let press = null;           // {x, y, dragging}
const DRAG_THRESHOLD = 6;   // px

petEl.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;      // 只响应左键
  press = { x: e.clientX, y: e.clientY, dragging: false };
});

window.addEventListener('mousemove', (e) => {
  if (!press) return;
  /* 拖拽中：把窗口跟到光标（主进程按屏幕坐标增量 setPosition）。
     ⚠️ Electron 没有 Tauri 那种"系统拖拽接管"，所以自己持续发坐标；
        光标一直压在窗口上 ⇒ mousemove 不会断。 */
  if (press.dragging) {
    if (e.buttons === 0) {          // 左键已松开 = 拖拽结束（兜底，主 mouseup 也会走一遍）
      press = null;
      setRates(false);
      if (petAPI) petAPI.dragEnd();
      return;
    }
    if (petAPI) petAPI.dragMove(e.screenX, e.screenY);
    return;
  }
  const dx = e.clientX - press.x, dy = e.clientY - press.y;
  if (Math.hypot(dx, dy) > DRAG_THRESHOLD) {
    press.dragging = true;
    setRates(true);                 // 拖拽态: 齿轮/辉光加速
    sayDrag();                      // 拖拽吐槽（8s 节流）
    if (petAPI) petAPI.dragStart(e.screenX, e.screenY);
    else console.warn('petAPI 不可用，无法拖动');
  }
});

window.addEventListener('mouseup', () => {
  if (press && !press.dragging) {
    // 未超阈值 = 单击 → 切换闭眼/睁眼 + 台词
    setState(cur === 'closed' ? 'idle' : 'closed');
    say('click');
  }
  if (press && press.dragging) {
    setRates(false);                // 恢复正常转速
    if (petAPI) petAPI.dragEnd();
  }
  press = null;
});

/* 右键桌宠 → 打开设置窗（R7）；系统默认菜单一律拦掉 */
petEl.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (petAPI) petAPI.openSettings();
});

/* ============ 台词气泡: 随机台词 + 打字机 ============ */
const LINES = { click: [], drag: [], idle: [] };
/* 台词池：由 lines.js 内联提供（file:// 下 fetch 会被 CORS 拦掉） */
if (typeof window.LINES_DATA === 'object' && window.LINES_DATA) Object.assign(LINES, window.LINES_DATA);

const bubble    = document.getElementById('bubble');
const bubbleTxt = document.getElementById('bubbleText');
const bubbleCaret = document.getElementById('bubbleCaret');
let typeTimer = null, hideTimer = null, lastLine = '';

function pick(arr){
  if (!arr.length) return '';
  let s = arr[Math.floor(Math.random() * arr.length)];
  if (arr.length > 1) { while (s === lastLine) s = arr[Math.floor(Math.random() * arr.length)]; }
  lastLine = s;
  return s;
}
/* 打字机: 完成后停留 4s 淡出。有语音时打字速度对齐音频时长（音频长度的 75% 打完）。 */
function say(kind){
  const pool = (LINES[kind] && LINES[kind].length) ? LINES[kind] : (FALLBACK[kind] || []);
  const text = pick(pool);
  if (!text) return;
  sayText(text, kind);
}
function sayText(text, kind){
  clearInterval(typeTimer); clearTimeout(hideTimer);
  bubbleCaret.style.display = '';
  bubbleTxt.textContent = '';
  bubble.style.marginBottom = '';            // 先回到默认位置再量
  bubble.classList.add('show');
  let i = 0;
  /* 气泡关闭时机（用户 09-15 要求：语音开着时等声音播完再关）：
     - 语音关 / 合成失败 → 打字完成后 4s 关闭（原行为）
     - 语音在播 → 等语音结束，再 0.8s 后淡出
     - 兜底：语音 30s 还没开始播（服务挂起等）→ 按无语音处理 */
  let typingDone = false;
  let voiceEnded = !(kind && CFG.voiceOn && petAPI);   // 无语音 = 视为已结束
  function scheduleBubbleHide(delay){
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => bubble.classList.remove('show'), delay);
  }
  function maybeHide(){ if (typingDone && voiceEnded) scheduleBubbleHide(800); }
  function finishTyping(){
    clearInterval(typeTimer);
    bubbleCaret.style.display = 'none';
    clampBubble();
    typingDone = true;
    if (voiceEnded) scheduleBubbleHide(4000);  // 无语音：维持原 4s 行为
    else maybeHide();                          // 有语音：等播完（onended 回调里关）
  }
  if (kind && CFG.voiceOn && petAPI){
    const cap = setTimeout(() => { voiceEnded = true; maybeHide(); }, 30000);   // 语音迟迟不来的兜底
    playVoiceSegments(text, kind).then(() => {
      clearTimeout(cap);
      voiceEnded = true; maybeHide();        // 语音结束 → 关气泡
    }).catch(() => { clearTimeout(cap); voiceEnded = true; maybeHide(); });
  } else {
    console.warn(`[voice] 跳过语音: kind=${kind} voiceOn=${CFG.voiceOn} petAPI=${!!petAPI}`);
  }
  typeTimer = setInterval(() => {
    bubbleTxt.textContent = text.slice(0, ++i);
    clampBubble();                           // 行数随打字增长，逐帧防顶部出窗
    if (i >= text.length) finishTyping();
  }, 35);
}

/* 防顶部裁切（用户 09-15 反馈"高的话顶部的显示不出来"）：
   气泡锚在圆盘顶往上长，高过窗口上部预留区时会被窗口上缘裁掉。
   量出超出量后把气泡整体下移（多压住圆盘一点），保证 top ≥ 8px。
   量的是气泡"高度"，margin 改动不影响高度 ⇒ 无反馈循环。 */
function clampBubble(){
  const s = CFG.scale || 1;
  const petTop = petEl.getBoundingClientRect().top;      // 圆盘顶（与气泡位置无关）
  const h = bubble.getBoundingClientRect().height;
  const wantLift = 14 * s;                                // 默认压住圆盘 14px
  const maxH = Math.max(40, petTop + wantLift - 8);       // 气泡顶至少留 8px
  if (h > maxH){
    bubble.style.marginBottom = `-${wantLift + (h - maxH)}px`;
  } else {
    bubble.style.marginBottom = '';
  }
}

/* ---- 语音播放（运行时 TTS：主进程 pet:ttsSpeak 返回 file:// 路径后播放） ----
   打字先走、声音后到（CPU 合成需要几秒~几十秒）；缓存后同一句秒开。
   任何失败静默回退纯文字。 */
var currentVoice = null;
let eyeStateBeforeVoice = null;    // 说话前的眼睛状态（null=不在语音中）——说完恢复
function voiceStopFx(){
  petEl.classList.remove('talking');
  setRates(false);
}
function playVoiceUrl(url){
  // 返回 Promise：音频播完（或失败）时 resolve——talking 态与眼睛由语音序列统一管理
  return new Promise(res => {
    try {
      if (currentVoice){ try { currentVoice.onended = null; currentVoice.pause(); } catch(e){} currentVoice = null; }
      const a = new Audio(url);
      currentVoice = a;
      a.volume = Math.min(1, Math.max(0, (CFG.voiceVolume ?? 80) / 100));
      let done = false;
      const finish = () => { if (!done){ done = true; res(); } };
      a.onended = finish;
      a.onplaying = () => console.warn(`[voice] 开始播放: ${url}`);
      a.onerror = () => { console.warn(`[voice] 音频加载失败: ${url}`); finish(); };   // 播放失败不影响文字
      a.play().catch(err => { console.warn(`[voice] play() 被拒: ${err.message}`); finish(); });
    } catch (e) { res(); }
  });
}

/* ── 按 …… 切段工具（语音队列用）── */
const VOICE_PAUSE_MS = 1000;                 // …… 的停顿时长
function sleepMs(ms){ return new Promise(r => setTimeout(r, ms)); }
function splitVoiceSegments(text){
  return text.split(/…+/).map(t => t.trim()).filter(Boolean);
}

/* ── 语音序列：说话时闭眼（用户 09-15 要求），说完恢复之前的状态 ──
   按 …… 切段逐段播放（豆包 2.0 音色不支持 SSML break，这是唯一能控制节奏的方式），
   talking 态（齿轮加速+亮度）与闭眼贯穿整个序列（含段间 1s 停顿），结束时统一恢复。 */
async function playVoiceSegments(text, kind){
  const segs = splitVoiceSegments(text);
  if (eyeStateBeforeVoice === null) eyeStateBeforeVoice = (cur === 'closed');
  setLidB(true);                           // 说话 → 闭眼
  petEl.classList.add('talking');
  setRates(true);
  try {
    for (let i = 0; i < segs.length; i++){
      let url = '';
      try { url = await petAPI.ttsSpeak(segs[i], kind); } catch(e){}
      if (url) await playVoiceUrl(url);    // 播完这段才继续
      if (i < segs.length - 1) await sleepMs(VOICE_PAUSE_MS);   // …… 停顿（眼睛保持闭着）
    }
  } finally {
    voiceStopFx();                         // 退出 talking 态
    setLidB(eyeStateBeforeVoice === true); // 恢复说话前的眼睛状态
    eyeStateBeforeVoice = null;
  }
}

let lastDragSay = 0;
function sayDrag(){
  const now = Date.now();
  if (now - lastDragSay < 8000) return;
  lastDragSay = now;
  say('drag');
}
let idleTimer = null;
function scheduleIdle(){
  clearTimeout(idleTimer);
  const wait = (CFG.idleMin + Math.random() * 35) * 1000;
  idleTimer = setTimeout(() => { say('idle'); scheduleIdle(); }, wait);
}

/* ============ lab 运动参数应用（设置窗 12 项） ============
   一一对应 fairy-lab 的 bind()：半径类直接改属性，靛蓝层/尖齿改 P 后重建 path。 */
function updateGlint(rp){
  /* 高光位置与虹膜半径联动：实测锚点方向 (20.2,27.2)，间距 = r + 12.5（球内缘压过深眼 1.7u） */
  const c = document.querySelector('#glintG > circle');
  if (!c) return;
  const d = rp + 12.5;
  c.setAttribute('cx', (20.2 / 34.3 * d).toFixed(2));
  c.setAttribute('cy', (27.2 / 34.3 * d).toFixed(2));
}
function applyLabParams(c){
  const g = id => document.getElementById(id);
  // ① 半径类
  if (c.rOuter     != null) g('lyOuter')?.setAttribute('r', c.rOuter);
  if (c.whiteOuter != null) g('lyWhite')?.setAttribute('r', c.whiteOuter);
  if (c.whiteInner != null) g('lySlate')?.setAttribute('r', c.whiteInner);
  if (c.iris       != null) { g('irisPupil')?.setAttribute('r', c.iris); updateGlint(c.iris); }
  if (c.glint      != null) document.querySelector('#glintG > circle')?.setAttribute('r', c.glint);
  // ② 靛蓝环带 + 尖齿：改 P 后重建 path
  let rebuild = false;
  if (c.indOuter != null) { P.base = c.indOuter; rebuild = true; }
  if (c.tip      != null) { P.tip  = c.tip;      rebuild = true; }
  if (c.half     != null) { P.half = c.half;     rebuild = true; }
  if (rebuild) buildIndigo();
  // ③ 扫描线：图案高度 = 周期，位移 = 一个周期（无缝）
  if (c.scan != null){
    const pat = g('scanlines');
    if (pat){
      pat.setAttribute('height', c.scan);
      if (pat.firstElementChild) pat.firstElementChild.setAttribute('height', (c.scan / 2).toFixed(2));
      g('scanAnim')?.setAttribute('to', `0 ${c.scan}`);
    }
  }
}

/* ============ 空闲降帧: 失焦 5 分钟后暂停扫描线+辉光（保留呼吸核心） ============ */
const IDLE_PAUSE_MS = 5 * 60 * 1000;
let idlePauseTimer = null;
let visualsPaused = false;

function setDecorPaused(paused){
  if (paused === visualsPaused) return;
  visualsPaused = paused;
  const scan = document.getElementById('scanAnim');
  const glowT = document.querySelector('#glowPulse > animateTransform');
  const glowO = document.querySelector('#glowPulse > animate');
  // SMIL 没有单元素 pause，用 beginElement/endElement 控制起停
  if (paused){
    scan?.endElement();  glowT?.endElement();  glowO?.endElement();
  } else {
    scan?.beginElement(); glowT?.beginElement(); glowO?.beginElement();
  }
}
function armIdlePause(){
  clearTimeout(idlePauseTimer);
  idlePauseTimer = setTimeout(() => {
    // 仅在窗口失焦时暂停；聚焦状态下保持完整动画
    if (!document.hasFocus()) setDecorPaused(true);
  }, IDLE_PAUSE_MS);
}
['mousemove','mousedown','keydown'].forEach(ev =>
  window.addEventListener(ev, () => { setDecorPaused(false); armIdlePause(); }, { passive: true }));
window.addEventListener('focus', () => { setDecorPaused(false); armIdlePause(); });
window.addEventListener('blur', armIdlePause);
armIdlePause();

try {
  const svgEl = document.getElementById('svg');
  listen('pet-hidden', () => svgEl.pauseAnimations());
  listen('pet-shown',  () => svgEl.unpauseAnimations());
